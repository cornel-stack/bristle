[project]
name = "bristle-pipeline"
version = "0.1.0"
description = "Bristle ingestion + synthesis pipeline (Tier 5) — Python 3.12 + FastAPI + Inngest."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "asyncpg>=0.30",
    "inngest>=0.4",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # Slice 5.2 — per-slice ML deps (standing OD-7): the constitution names these
    # exact providers; you don't hand-roll provider clients.
    "anthropic>=0.40",
    "openai>=1.50",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

# An application, not a library — uv installs deps into .venv but does not build
# or install this project itself (no build backend needed). Imports resolve via
# the src layout (pytest pythonpath below; uvicorn runs with --app-dir src).
[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
